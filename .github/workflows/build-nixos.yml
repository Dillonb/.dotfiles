name: Build NixOS systems

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_ENDPOINT: https://attic.dgb.sh/
  ATTIC_CACHE: system
  ATTIC_PUBLIC_KEY: system:E5ubGe/xsSF5nf2gxvZBP4WSVVFWis3lo+3A3HERoxc=
  ALTERNATE_CACHE_ENDPOINT: https://cache.nix.dgb.sh
  ALTERNATE_CACHE_PUBLIC_KEY: cache.nix.dgb.sh:XzJS7VYoZ90T3fwKySBAqfKdxViX6zk2PJvlKVD+euU=

jobs:
  # Generate the build matrix from the flake so it always tracks the nixos/darwin
  # configurations. Each entry carries the attr to build, its (deterministic)
  # output path, and a runner routed by platform.
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.generate.outputs.include }}
      unchanged: ${{ steps.generate.outputs.unchanged }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = ${{ env.ATTIC_ENDPOINT }}${{ env.ATTIC_CACHE }} ${{ env.ALTERNATE_CACHE_ENDPOINT }}
            extra-trusted-public-keys = ${{ env.ATTIC_PUBLIC_KEY }} ${{ env.ALTERNATE_CACHE_PUBLIC_KEY }}
      - name: Generate matrix
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=$(nix eval --raw .#github-actions-matrix)
          # Build only the systems whose output path isn't the one already
          # published in the corresponding GitHub release.
          include='[]'
          unchanged='[]'
          while read -r entry; do
            name=$(jq -r '.name' <<<"$entry")
            path=$(jq -r '.path' <<<"$entry")
            tag="system-$name"
            released=$(gh release download "$tag" --pattern store-path --output - 2>/dev/null | head -n1 | tr -d '[:space:]' || true)
            if [ "$released" = "$path" ]; then
              echo "✔ released, skipping: $path"
              unchanged=$(jq -c --arg n "$name" '. + [$n]' <<<"$unchanged")
            else
              echo "building: $path (released: ${released:-<none>})"
              include=$(jq -c --argjson e "$entry" --arg r "$released" '. + [$e + {released: $r}]' <<<"$include")
            fi
          done < <(jq -c '.[]' <<<"$base")
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "unchanged=$unchanged" >> "$GITHUB_OUTPUT"
          jq . <<<"$include"

  build:
    name: Build ${{ matrix.name }}
    needs: matrix
    if: ${{ needs.matrix.outputs.include != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = ${{ env.ATTIC_ENDPOINT }}${{ env.ATTIC_CACHE }} ${{ env.ALTERNATE_CACHE_ENDPOINT }}
            extra-trusted-public-keys = ${{ env.ATTIC_PUBLIC_KEY }} ${{ env.ALTERNATE_CACHE_PUBLIC_KEY }}

      - name: Set up attic cache
        if: ${{ env.ATTIC_TOKEN != '' }}
        uses: ryanccn/attic-action@v0.5.0
        with:
          endpoint: ${{ env.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Monitor nix store
        if: ${{ env.ATTIC_TOKEN != '' }}
        run: nohup attic watch-store "$ATTIC_CACHE" &

      - name: Check cache
        id: cache
        run: |
          store="${{ env.ATTIC_ENDPOINT }}${{ env.ATTIC_CACHE }}"
          if nix path-info --store "$store" '${{ matrix.path }}' >/dev/null 2>&1; then
            echo "✔ cached: ${{ matrix.path }}"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "not cached: ${{ matrix.path }}"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: ${{ runner.os == 'Linux' && steps.cache.outputs.hit != 'true' }}
        uses: thiagokokada/free-disk-space@d3e470a0e298133572dc766e6b10d5a51c71c0e3 # Dec 10, 2025
        with:
          tool-cache: true
          opt: true
          usrlocal: true
          usrmisc: true

      - name: Build ${{ matrix.name }}
        if: ${{ steps.cache.outputs.hit != 'true' }}
        run: |
          nix build --keep-going -L --show-trace "${{ matrix.target }}"
          if [ -n "$ATTIC_TOKEN" ]; then
            attic push "$ATTIC_CACHE" ./result
          fi

      - name: Publish ${{ matrix.name }} release
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag='system-${{ matrix.name }}'
          printf '%s\n' '${{ matrix.path }}' > store-path

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" store-path --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create "$tag" store-path \
              --target "$GITHUB_SHA" \
              --title "${{ matrix.name }}" \
              --notes "Latest successful ${{ matrix.name }} system build"
          fi

  nvd-diff:
    name: Post nvd diff
    needs:
      - matrix
      - build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Install nvd
        run: nix profile install --no-write-lock-file github:Dillonb/nvd

      - name: Diff closures
        continue-on-error: true
        env:
          INCLUDE: ${{ needs.matrix.outputs.include || '[]' }}
          # Every cache the closures are spread across, in priority order.
          STORES: >-
            ${{ env.ATTIC_ENDPOINT }}${{ env.ATTIC_CACHE }}
            ${{ env.ALTERNATE_CACHE_ENDPOINT }}
            https://cache.nixos.org
        run: |
          mkdir -p nvd-diff
          stores=()
          for store in $STORES; do stores+=(--store "$store"); done

          # A path only reaches a cache once its build has succeeded.
          in_cache() {
            for store in $STORES; do
              nix path-info --store "$store" --option substituters "" "$1" \
                >/dev/null 2>&1 && return 0
            done
            return 1
          }

          # nvd reads closure metadata straight from the caches, so neither
          # closure has to be downloaded in order to diff them.
          while read -r entry; do
            name=$(jq -r '.name' <<<"$entry")
            old=$(jq -r '.released' <<<"$entry")
            new=$(jq -r '.path' <<<"$entry")
            [ -n "$old" ] || continue

            out="nvd-diff/$name.txt"
            if ! in_cache "$new"; then
              echo "Build failed, nothing to diff." > "$out"
            elif ! nvd "${stores[@]}" diff "$old" "$new" \
                    >"$out" 2>"$out.err" </dev/null; then
              { echo "Could not diff $old -> $new."; echo; cat "$out.err"; } > "$out"
            fi
            rm -f "$out.err"
          done < <(jq -c '.[]' <<<"$INCLUDE")

      - name: Render comment
        env:
          UNCHANGED: ${{ needs.matrix.outputs.unchanged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - > comment.md <<'PY'
          import json, os, pathlib

          diffs = sorted(pathlib.Path("nvd-diff").glob("*.txt"))
          if not diffs:
              raise SystemExit
          cap = 58000 // len(diffs)  # GitHub caps comments at 65536 characters

          out = ["<!-- nvd-diff -->", "## `nvd` closure diff vs. `master`", ""]
          for p in diffs:
              text = p.read_text(errors="replace").strip()
              if len(text) > cap:
                  text = text[:cap].rsplit("\n", 1)[0] + "\n... truncated ..."
              out += [f"<details><summary><code>{p.stem}</code></summary>", "",
                      "```", text, "```", "", "</details>", ""]

          unchanged = json.loads(os.environ.get("UNCHANGED") or "[]")
          if unchanged:
              out += ["Unchanged: " + ", ".join(f"`{n}`" for n in sorted(unchanged)), ""]
          out += [f"[Workflow run]({os.environ['RUN_URL']})"]
          print("\n".join(out))
          PY

      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -s comment.md ] || exit 0
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- nvd-diff -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md --silent
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -F body=@comment.md --silent
          fi
